<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050505">
<title>Painel de feedbacks · PULZR</title>
<link rel="icon" href="img/apontando.webp">
<link rel="manifest" href="painel.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feedbacks">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#0E100E;--card2:#141714;--line:#232822;--lime:#B6FF00;--soft:rgba(182,255,0,.45);--text:#fff;--sub:#C9CDC6;--muted:#8C9289;--red:#FF5A5A;
 --display:"Barlow Condensed",system-ui,sans-serif;--body:"Manrope",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body)}
main{max-width:900px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.hero{display:flex;align-items:flex-end;gap:10px}.hero img{width:96px;flex:none}
h1{font:800 clamp(1.9rem,6vw,2.6rem)/1 var(--display);margin:0;text-transform:uppercase;letter-spacing:.03em}h1 span{color:var(--lime)}
.lead{margin:6px 0 0;color:var(--sub)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.label{font:800 .66rem var(--body);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 .8rem var(--body);padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer}
.chip[aria-pressed=true]{background:var(--lime);color:var(--bg);border-color:var(--lime)}
.go{font:800 1rem var(--display);letter-spacing:.12em;background:var(--lime);color:var(--bg);border:0;border-radius:14px;padding:12px 18px;cursor:pointer;box-shadow:0 0 16px rgba(182,255,0,.45)}
.go:disabled{opacity:.5}
.go.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:620px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile b{display:block;font:800 2rem/1 var(--display);font-variant-numeric:tabular-nums}.tile.t b{color:var(--lime)}
.tile span{font:800 .62rem var(--body);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.fb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fb header{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font:800 .66rem var(--body);letter-spacing:.12em;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card2)}
.tag.erro{color:var(--red);border-color:rgba(255,90,90,.5)}.tag.sugestao,.tag.elogio{color:var(--lime);border-color:var(--soft)}
.who{font-weight:800}.meta{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--sub);margin:0}
.files{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.files a img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.files audio{max-width:100%;height:38px}
.report{background:var(--card);border:1px solid var(--soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.report pre{margin:0;max-height:240px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,monospace;color:var(--sub);white-space:pre-wrap;overflow-wrap:anywhere}
.state{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:20px;display:flex;gap:14px;align-items:center}
.state img{width:84px;flex:none}.state h2{font:800 1.4rem var(--display);margin:0 0 4px;text-transform:uppercase}.state p{margin:0;color:var(--sub)}
.link{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem;color:var(--sub)}
.link code{color:var(--lime);background:var(--card2);padding:4px 8px;border-radius:8px;overflow-wrap:anywhere}
.ok{color:var(--lime);font-weight:700}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<main>
  <header class="hero">
    <img src="img/apontando.webp" alt="Pulsinho">
    <div><h1>Painel de <span>feedbacks</span></h1><p class="lead">Tudo o que chegou pelo link público e pelo app. Só você acessa.</p></div>
  </header>
  <div class="link">Link para mandar ao pessoal: <code id="publicLink"></code><button class="go ghost" type="button" id="copyLink" style="padding:8px 12px;font-size:.85rem">COPIAR</button></div>
  <section class="bar">
    <span class="label">Período</span><div class="chips" id="periods"></div>
    <span class="label">Tipo</span><div class="chips" id="kinds"></div>
    <button class="chip" type="button" id="archTab" aria-pressed="false">📦 Arquivados</button>
    <button class="go ghost" type="button" id="notify" style="margin-left:auto" hidden>🔔 ATIVAR AVISOS</button>
    <button class="go" type="button" id="load">ATUALIZAR ⚡</button>
  </section>
  <p class="meta" id="pushInfo" hidden></p>
  <div id="out"></div>
</main>
<script>
(function(){
const FN='https://cnxlhawafqtymfzoxere.supabase.co/functions/v1/pulzr-feedback-painel';
const PERIODS=[[7,'7 dias'],[30,'30 dias'],[90,'90 dias'],[0,'Tudo']];
const KINDS=[['','Todos'],['erro','Erros'],['sugestao','Ideias'],['elogio','Elogios'],['outro','Outros']];
const LABEL={erro:'ERRO',sugestao:'IDEIA',elogio:'ELOGIO',outro:'OUTRO'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let key='';try{key=new URLSearchParams(location.hash.slice(1)).get('admin')||localStorage.getItem('pulzr-fb-admin')||'';}catch(_){}
// A chave fica no endereço para o ícone da tela inicial (iPhone guarda o app separado do Safari) já abrir logado.
if(location.hash.includes('admin=')){try{localStorage.setItem('pulzr-fb-admin',key);}catch(_){}}
else if(key){history.replaceState(null,'',location.pathname+'#admin='+encodeURIComponent(key));}
let days=30,kind='',arch=false;
$('publicLink').textContent=new URL('./',location.href).href;
$('copyLink').onclick=()=>navigator.clipboard.writeText(new URL('./',location.href).href).then(()=>{$('copyLink').textContent='COPIADO ✓';});
function chips(el,items,cur,set){el.innerHTML='';items.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=l;b.setAttribute('aria-pressed',String(v===cur));b.onclick=()=>{set(v);renderChips();load();};el.appendChild(b);});}
function renderChips(){chips($('periods'),PERIODS,days,v=>days=v);chips($('kinds'),KINDS,kind,v=>kind=v);}
renderChips();
function state(img,t,p){$('out').innerHTML=`<div class="state"><img src="img/${img}.webp" alt=""><div><h2>${t}</h2><p>${p}</p></div></div>`;}
const fmt=d=>new Date(d).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
async function load(){
  if(!key){state('bracos-cruzados','Acesso restrito','Cole a sua chave de acesso para entrar.');
    $('out').querySelector('.state div').insertAdjacentHTML('beforeend','<form id="kf" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="ki" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Chave de acesso" style="flex:1;min-width:160px;font:15px var(--body);padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text)"><button class="go" type="submit">ENTRAR</button></form>');
    $('kf').onsubmit=e=>{e.preventDefault();const v=$('ki').value.trim().replace(/^.*admin=/,'');if(!v)return;key=decodeURIComponent(v);try{localStorage.setItem('pulzr-fb-admin',key);}catch(_){}history.replaceState(null,'',location.pathname+'#admin='+encodeURIComponent(key));info('');load();};
    return;}
  $('load').disabled=true;$('load').textContent='CARREGANDO…';
  try{
    const r=await fetch(FN+'?days='+days+'&kind='+kind+(arch?'&archived=1':''),{headers:{'x-pulzr-admin':key}});
    if(r.status===401){try{localStorage.removeItem('pulzr-fb-admin');}catch(_){}key='';state('bracos-cruzados','Chave inválida','A chave de acesso não confere. Abra o painel pelo link completo de novo.');return;}
    const d=await r.json();if(!r.ok)throw new Error(d.error||'erro');
    render(d.rows||[]);
  }catch(_){state('bracos-cruzados','Não deu para carregar','Confira sua internet e aperte Atualizar.');}
  finally{$('load').disabled=false;$('load').textContent='ATUALIZAR ⚡';}
}
$('load').onclick=load;
$('archTab').onclick=()=>{arch=!arch;$('archTab').setAttribute('aria-pressed',String(arch));load();};
async function archive(ids,archived){
  const r=await fetch(FN+'?action=archive',{method:'POST',headers:{'x-pulzr-admin':key,'content-type':'application/json'},body:JSON.stringify({ids,archived})}).catch(()=>null);
  if(r&&r.ok)load();else alert('Não deu para arquivar agora. Tente de novo.');
}
function report(rows){
  const c=k=>rows.filter(r=>r.kind===k).length;
  const lines=['# Relatório de feedbacks PULZR',`Período: ${days?'últimos '+days+' dias':'todo o período'} · Gerado em ${fmt(new Date())}`,
   `Total: ${rows.length} (erros ${c('erro')}, ideias ${c('sugestao')}, elogios ${c('elogio')}, outros ${c('outro')})`,''];
  for(const k of ['erro','sugestao','elogio','outro']){const g=rows.filter(r=>r.kind===k);if(!g.length)continue;lines.push(`## ${LABEL[k]} (${g.length})`);
    for(const r of g){const who=[r.name||'Sem nome',r.username?'@'+r.username:'',r.email,r.phone].filter(Boolean).join(' · ');
      const imgs=r.files.filter(f=>f.type==='image').length,aud=r.files.filter(f=>f.type==='audio').length;
      const extra=[r.source==='link'?'link público':'app',r.platform,imgs?imgs+' print(s)':'',aud?'áudio':''].filter(Boolean).join(' · ');
      lines.push(`- #${r.id} · ${fmt(r.created_at)} · ${who} · ${extra}`);lines.push(`  "${(r.message||'(sem texto, só anexo)').replace(/\s*\n\s*/g,' / ')}"`);}
    lines.push('');}
  lines.push('Claude, interprete esses feedbacks: agrupe por assunto, diga o que mais se repete, o que é urgente e o que vale ajustar no app.');
  return lines.join('\n');
}
function render(rows){
  if(!rows.length){arch?state('joinha','Nenhum arquivado','Os feedbacks que você arquivar aparecem aqui.'):state('joinha','Tudo em dia','Nenhum feedback pendente nesse período.');return;}
  const c=k=>rows.filter(r=>r.kind===k).length;
  const text=report(rows);
  $('out').innerHTML=`<div class="tiles">${[['t','Total',rows.length],['','Erros',c('erro')],['','Ideias',c('sugestao')],['','Elogios',c('elogio')],['','Outros',c('outro')]].map(([cl,l,n])=>`<div class="tile ${cl}"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
   <section class="report" style="margin-top:16px"><div class="label" style="color:var(--lime)">Relatório para colar no Claude</div><pre id="txt"></pre>
   <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="go" type="button" id="copy">COPIAR RELATÓRIO</button><span class="ok" id="copied" hidden>Copiado! Cole na conversa com o Claude.</span><button class="go ghost" type="button" id="archAll" style="margin-left:auto">${arch?'↩ DESARQUIVAR TODOS':'📦 ARQUIVAR TODOS ('+rows.length+')'}</button></div></section>
   <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">${rows.map(r=>`<article class="fb">
    <header><span class="tag ${esc(r.kind)}">${LABEL[r.kind]||'OUTRO'}</span><span class="who">${esc(r.name||'Sem nome')}</span>${r.username?`<span class="meta">@${esc(r.username)}</span>`:''}${r.email?`<span class="meta">${esc(r.email)}</span>`:''}${r.phone?`<span class="meta">${esc(r.phone)}</span>`:''}</header>
    ${r.message?`<p class="msg">${esc(r.message)}</p>`:''}
    ${r.files.length?`<div class="files">${r.files.map(f=>!f.url?'<span class="meta">anexo indisponível</span>':f.type==='audio'?`<audio controls preload="none" src="${esc(f.url)}"></audio>`:`<a href="${esc(f.url)}" target="_blank" rel="noopener"><img src="${esc(f.url)}" alt="Print enviado" loading="lazy"></a>`).join('')}</div>`:''}
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div class="meta">#${r.id} · ${fmt(r.created_at)} · ${r.source==='link'?'link público':'app'}${r.platform?' · '+esc(r.platform):''}${r.app_version?' · v'+esc(r.app_version):''}</div><button class="chip" type="button" data-arch="${r.id}">${arch?'↩ Desarquivar':'📦 Arquivar'}</button></div></article>`).join('')}</div>`;
  $('txt').textContent=text;
  $('archAll').onclick=()=>{if(confirm(arch?'Desarquivar todos desta lista?':'Arquivar os '+rows.length+' feedbacks desta lista?'))archive(rows.map(r=>r.id),!arch);};
  $('out').querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>{b.disabled=true;archive([Number(b.dataset.arch)],!arch);});
  $('copy').onclick=()=>navigator.clipboard.writeText(text).then(()=>{$('copied').hidden=false;},()=>{const g=document.createRange();g.selectNodeContents($('txt'));const s=getSelection();s.removeAllRanges();s.addRange(g);});
}
load();
// App instalável + avisos (push) de feedback novo.
const b64=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0));};
const info=t=>{$('pushInfo').hidden=!t;$('pushInfo').textContent=t||'';};
async function pushSetup(){
  if(!('serviceWorker' in navigator))return;
  const reg=await navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='reload')load();});
  if(!('PushManager' in window)||!('Notification' in window)){
    if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)info('No iPhone: toque em Compartilhar → "Adicionar à Tela de Início", abra pelo ícone e ative os avisos.');
    return;}
  const sub=await reg.pushManager.getSubscription();
  const btn=$('notify');
  if(sub&&Notification.permission==='granted'){btn.hidden=false;btn.textContent='🔔 AVISOS LIGADOS';btn.onclick=()=>send(sub,'test');save(sub);return;}
  btn.hidden=false;
  btn.onclick=async()=>{
    if(!key){info('Entre com a sua chave primeiro (campo abaixo) e depois ative os avisos.');return;}
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){info('Os avisos foram bloqueados. Libere nas configurações do navegador para este site.');return;}
    try{const v=await (await fetch(FN+'?action=vapid',{headers:{'x-pulzr-admin':key}})).json();
      const s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(v.key)});
      await save(s);btn.textContent='🔔 AVISOS LIGADOS';info('Pronto! Mandei um aviso de teste.');send(s,'test');
      btn.onclick=()=>send(s,'test');}
    catch(_){info('Não deu para ativar os avisos agora. Tente de novo.');}
  };
}
function save(s){return send(s,'subscribe');}
function send(s,action){return fetch(FN+'?action='+action,{method:'POST',headers:{'x-pulzr-admin':key,'content-type':'application/json'},body:JSON.stringify(s)}).catch(()=>{});}
pushSetup().catch(()=>{});
})();
</script>
</body>
</html>
